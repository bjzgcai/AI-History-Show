client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;

server {
    listen 8000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The presentation image is the only public service. Keep source, admin,
    # API and hidden files unavailable even if a broader web root is mounted
    # by mistake.
    location ~* ^/(?:archive|manage|scripts|research|reports|api)(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    # Existing files with a known static extension must never fall back to
    # index.html. This keeps missing assets and metadata honest 404s.
    location ~* \.(?:js|mjs|css|json|map|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|mp3|wav|m4a|ogg|mp4|webm|pdf|txt|xml)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Baseline browser protections for the public exhibit.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' https://media.sciencearena.cn; connect-src 'self' https://media.sciencearena.cn" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/html application/javascript application/json image/svg+xml;
}
