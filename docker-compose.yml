services:
    presentation:
        build:
            context: .
            target: presentation
        ports:
            - '8000:8000'
        read_only: true
        tmpfs:
            - /tmp
            - /var/cache/nginx
            - /var/run

    admin:
        build:
            context: .
            target: admin
        ports:
            - '127.0.0.1:3001:3001'
        environment:
            HOST: 0.0.0.0
            PORT: 3001
        command: node manage/server.js
        volumes:
            - .:/app
        profiles:
            - admin

    audio-review:
        build:
            context: .
            target: audio-review
        ports:
            - '3002:3002'
        environment:
            HOST: 0.0.0.0
            PORT: 3002
            AUDIO_REVIEW_DATA: /review-input/review-data.json
            AUDIO_REVIEW_DB: /data/reviews.sqlite
            AUDIO_REVIEW_TOKEN_FILE: /run/secrets/audio-review-tokens.json
            AUDIO_REVIEW_SECURE_COOKIE: 'false'
        read_only: true
        tmpfs:
            - /tmp
        volumes:
            - ./.tmp/audio-review-data:/data
            - ./tools/audio-review-console/review-data.json:/review-input/review-data.json:ro
            - ./resources/audio/generated:/app/resources/audio/generated:ro
            - ./.secrets/audio-review-tokens.json:/run/secrets/audio-review-tokens.json:ro
        profiles:
            - review
