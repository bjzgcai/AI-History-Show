<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Squeeze-and-Excitation Networks process explainer</title><desc id="desc">Four-stage original explainer for Squeeze-and-Excitation Networks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="105" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="42" font-weight="700">Squeeze-and-Excitation Networks</text><text x="600" y="155" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="23">Global channel summary followed by learned channel gates</text><g><rect x="70" y="260" width="220" height="150" rx="8" fill="#0f766e"/><text x="180" y="325" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Feature channels</text><text x="180" y="360" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">STEP 1</text></g><g><rect x="345" y="260" width="220" height="150" rx="8" fill="#2563eb"/><text x="455" y="325" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Global squeeze</text><text x="455" y="360" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">STEP 2</text></g><g><rect x="620" y="260" width="220" height="150" rx="8" fill="#ca8a04"/><text x="730" y="325" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Learn channel weights</text><text x="730" y="360" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">STEP 3</text></g><g><rect x="895" y="260" width="220" height="150" rx="8" fill="#c2410c"/><text x="1005" y="325" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">Recalibrated features</text><text x="1005" y="360" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">STEP 4</text></g><path d="M 290 335 L 330 335" stroke="#334155" stroke-width="8" marker-end="url(#arrow)"/><path d="M 565 335 L 605 335" stroke="#334155" stroke-width="8" marker-end="url(#arrow)"/><path d="M 840 335 L 880 335" stroke="#334155" stroke-width="8" marker-end="url(#arrow)"/><text x="600" y="560" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="22">Original local explainer based on the cited primary publication</text></svg>
