<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Post-training pipeline</title>
  <desc id="desc">A foundation model is shaped by supervised instruction tuning, preference feedback, and reinforcement learning into a more useful reasoning assistant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#263449"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <g opacity="0.18" fill="none" stroke="#ffffff">
    <path d="M85 140 C245 45, 425 235, 590 130 S940 90, 1095 190"/>
    <path d="M70 570 C260 470, 420 610, 610 515 S925 430, 1125 535"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="92" y="250" width="230" height="164" rx="24" fill="#f8fafc"/>
    <rect x="367" y="250" width="206" height="164" rx="24" fill="#eff6ff"/>
    <rect x="625" y="160" width="212" height="128" rx="24" fill="#ecfeff"/>
    <rect x="625" y="376" width="212" height="128" rx="24" fill="#f0fdf4"/>
    <rect x="893" y="250" width="218" height="164" rx="24" fill="#fff7ed"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#0f172a">
    <text x="207" y="305" text-anchor="middle" font-size="26" font-weight="700">Pretrained</text>
    <text x="207" y="340" text-anchor="middle" font-size="26" font-weight="700">Foundation Model</text>
    <text x="207" y="377" text-anchor="middle" font-size="18" fill="#475569">next-token prediction</text>
    <text x="470" y="313" text-anchor="middle" font-size="25" font-weight="700">Instruction</text>
    <text x="470" y="348" text-anchor="middle" font-size="25" font-weight="700">Tuning</text>
    <text x="470" y="383" text-anchor="middle" font-size="18" fill="#475569">tasks and formats</text>
    <text x="731" y="212" text-anchor="middle" font-size="23" font-weight="700">Preference</text>
    <text x="731" y="246" text-anchor="middle" font-size="23" font-weight="700">Feedback</text>
    <text x="731" y="454" text-anchor="middle" font-size="25" font-weight="700">RL</text>
    <text x="731" y="486" text-anchor="middle" font-size="18" fill="#475569">rewarded behavior</text>
    <text x="1002" y="309" text-anchor="middle" font-size="25" font-weight="700">Useful Reasoning</text>
    <text x="1002" y="344" text-anchor="middle" font-size="25" font-weight="700">Assistant</text>
    <text x="1002" y="381" text-anchor="middle" font-size="18" fill="#475569">aligned, task-aware, iterative</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M326 332 H358"/>
    <path d="M350 318 L364 332 L350 346"/>
    <path d="M573 332 H616"/>
    <path d="M608 318 L622 332 L608 346"/>
    <path d="M837 224 C875 244, 891 277, 891 313"/>
    <path d="M878 303 L891 320 L904 303"/>
    <path d="M837 440 C876 421, 892 385, 892 350"/>
    <path d="M878 360 L892 344 L905 361"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="600" y="83" text-anchor="middle" fill="#e5f7ff" font-size="34" font-weight="800">Post-training turns scale into usable intelligence</text>
    <text x="600" y="624" text-anchor="middle" fill="#cbd5e1" font-size="22">SFT teaches instructions. Feedback supplies preferences. RL strengthens chosen reasoning and behavior.</text>
  </g>
</svg>
