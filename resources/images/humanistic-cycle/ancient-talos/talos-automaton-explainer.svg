  <title id="title">Talos bronze automaton explainer</title>
  <desc id="desc">Original exhibition diagram showing Talos as a bronze guardian with one vulnerable life channel.</desc>
  <rect width="1200" height="720" fill="#101820"/>
  <g fill="none" stroke="#d9a441" stroke-width="12">
    <circle cx="430" cy="180" r="74"/>
    <path d="M430 254v250M350 330l80 60 80-60M365 504l-55 126M495 504l55 126"/>
    <path d="M430 260c-38 82-40 150 0 242" stroke="#f06b4f" stroke-width="8"/>
  </g>
  <circle cx="430" cy="410" r="17" fill="#f06b4f"/>
  <g font-family="Arial, sans-serif" fill="#f5f0e6">
    <text x="660" y="160" font-size="34">BRONZE GUARDIAN</text>
    <text x="660" y="215" font-size="24" fill="#d8cdbb">Artificial body · autonomous patrol</text>
