<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">LLaMA scaling recipe</title>
  <desc id="desc">Training-compute policy, not a new secret block architecture. The paper discloses scales, token budgets and data policy; it does not claim a novel internal block. Compare parameter count and token budget: which choice shifts training cost versus inference cost?</desc>
