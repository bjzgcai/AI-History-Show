  <text x="510" y="155" fill="#e0aa59" font-family="Arial, sans-serif" font-size="12" font-weight="700"><tspan x="510" dy="0">STEP 3</tspan></text>
  <text x="510" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="510" dy="0">Projection + frozen</tspan><tspan x="510" dy="22">LLM</tspan></text>
  <text x="510" y="254" fill="#c8d6e2" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="510" dy="0">Align vision to language</tspan></text>
  <path d="M690 214 H696" stroke="#d8e5ef" stroke-width="4" fill="none"/><path d="M684 205 L696 214 L684 223" stroke="#d8e5ef" stroke-width="4" fill="none"/>
