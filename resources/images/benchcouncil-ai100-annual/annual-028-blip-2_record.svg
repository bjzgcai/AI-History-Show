  <text x="732" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="732" dy="0">Image-grounded text</tspan></text>
  <text x="732" y="254" fill="#c8d6e2" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="732" dy="0">Captioning, VQA and</tspan><tspan x="732" dy="18">dialogue</tspan></text>

</g>
  <rect x="48" y="336" width="864" height="82" rx="8" fill="#132635" stroke="#315267" stroke-width="1.5"/>
