<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">BLIP-2 Q-Former bridge</title>
  <desc id="desc">Train a compact interface while keeping both large backbones frozen. BLIP-2 trains the Q-Former in staged objectives instead of jointly retraining both pretrained backbones. Trace which query tokens carry image evidence into the frozen language model.</desc>
  <rect width="960" height="560" fill="#0d1722"/>
  <text x="48" y="52" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="48" dy="0">BLIP-2 Q-Former bridge</tspan></text>
  <text x="48" y="82" fill="#a9bdd0" font-family="Arial, sans-serif" font-size="15" font-weight="400"><tspan x="48" dy="0">Train a compact interface while keeping both large backbones frozen</tspan></text>
  <g>
  <rect x="48" y="126" width="198" height="176" rx="8" fill="#173d51" stroke="#62b7d7" stroke-width="2"/>
  <text x="66" y="155" fill="#62b7d7" font-family="Arial, sans-serif" font-size="12" font-weight="700"><tspan x="66" dy="0">STEP 1</tspan></text>
  <text x="66" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="66" dy="0">Frozen image encoder</tspan></text>
  <text x="66" y="254" fill="#c8d6e2" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="66" dy="0">Produces visual features</tspan></text>
  <path d="M246 214 H252" stroke="#d8e5ef" stroke-width="4" fill="none"/><path d="M240 205 L252 214 L240 223" stroke="#d8e5ef" stroke-width="4" fill="none"/>
</g>
<g>
