  <text x="288" y="155" fill="#79c58c" font-family="Arial, sans-serif" font-size="12" font-weight="700"><tspan x="288" dy="0">STEP 2</tspan></text>
  <text x="288" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="288" dy="0">Learned projection W</tspan></text>
  <text x="288" y="254" fill="#c8d6e2" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="288" dy="0">Maps visual features to</tspan><tspan x="288" dy="18">tokens</tspan></text>
  <path d="M468 214 H474" stroke="#d8e5ef" stroke-width="4" fill="none"/><path d="M462 205 L474 214 L462 223" stroke="#d8e5ef" stroke-width="4" fill="none"/>
