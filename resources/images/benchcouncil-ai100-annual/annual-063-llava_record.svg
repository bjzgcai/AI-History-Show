  <text x="510" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="510" dy="0">Visual tokens +</tspan><tspan x="510" dy="22">instruction</tspan></text>
  <text x="510" y="254" fill="#c8d6e2" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="510" dy="0">Enter the language model</tspan></text>
