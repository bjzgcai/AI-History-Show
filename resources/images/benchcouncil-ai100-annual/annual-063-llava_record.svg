<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">LLaVA visual instruction tuning</title>
  <desc id="desc">Map vision features into a language model, then teach image-grounded instruction following. The training sequence separates feature alignment from multimodal instruction tuning. Follow one image region through projection and ask which response tokens depend on it.</desc>
  <rect width="960" height="560" fill="#0d1722"/>
  <text x="48" y="52" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="48" dy="0">LLaVA visual instruction tuning</tspan></text>
  <text x="48" y="82" fill="#a9bdd0" font-family="Arial, sans-serif" font-size="15" font-weight="400"><tspan x="48" dy="0">Map vision features into a language model, then teach image-grounded instruction following</tspan></text>
  <g>
  <rect x="48" y="126" width="198" height="176" rx="8" fill="#173d51" stroke="#62b7d7" stroke-width="2"/>
  <text x="66" y="155" fill="#62b7d7" font-family="Arial, sans-serif" font-size="12" font-weight="700"><tspan x="66" dy="0">STEP 1</tspan></text>
  <text x="66" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="66" dy="0">Image input</tspan></text>
  <text x="66" y="254" fill="#c8d6e2" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="66" dy="0">CLIP vision encoder</tspan></text>
