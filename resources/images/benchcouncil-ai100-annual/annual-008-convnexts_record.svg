<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">ConvNeXt modernization path</title>
  <desc id="desc">Original explainer tracing a standard ResNet through modern training, macro design and block design to a scalable pure convolutional network.</desc>
  <rect width="960" height="560" fill="#101820"/>
  <text x="48" y="58" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="28" font-weight="700">ConvNeXt: modernizing a ResNet</text>
  <text x="48" y="86" fill="#aab9c4" font-family="Arial, sans-serif" font-size="15">Transformer-era choices, standard convolutional components</text>

  <rect x="48" y="120" width="184" height="330" rx="8" fill="#182a35" stroke="#69b6d5" stroke-width="2"/>
  <text x="72" y="156" fill="#89cbe6" font-family="Arial, sans-serif" font-size="15" font-weight="700">START</text>
  <text x="72" y="190" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="24" font-weight="700">Standard ResNet</text>
  <rect x="72" y="222" width="136" height="42" rx="6" fill="#244657"/>
  <text x="88" y="249" fill="#d9edf5" font-family="Arial, sans-serif" font-size="15">3 x 3 convolution</text>
  <rect x="72" y="278" width="136" height="42" rx="6" fill="#244657"/>
  <text x="88" y="305" fill="#d9edf5" font-family="Arial, sans-serif" font-size="15">BatchNorm + ReLU</text>
  <rect x="72" y="334" width="136" height="42" rx="6" fill="#244657"/>
  <text x="88" y="361" fill="#d9edf5" font-family="Arial, sans-serif" font-size="15">Bottleneck blocks</text>
  <text x="72" y="414" fill="#91a5b1" font-family="Arial, sans-serif" font-size="14">2010s baseline</text>

  <path d="M232 285 H276" fill="none" stroke="#f4f7f9" stroke-width="4"/>
  <path d="M268 277 L280 285 L268 293" fill="none" stroke="#f4f7f9" stroke-width="4"/>

  <rect x="280" y="120" width="398" height="330" rx="8" fill="#20252e" stroke="#d9a65a" stroke-width="2"/>
  <text x="306" y="156" fill="#f0bd70" font-family="Arial, sans-serif" font-size="15" font-weight="700">SYSTEMATIC MODERNIZATION</text>

  <rect x="306" y="178" width="346" height="70" rx="8" fill="#34303a"/>
  <circle cx="334" cy="213" r="16" fill="#d8695d"/>
  <text x="329" y="219" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">1</text>
  <text x="362" y="204" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="17" font-weight="700">Modern training recipe</text>
  <text x="362" y="228" fill="#c8d1d8" font-family="Arial, sans-serif" font-size="14">AdamW, augmentation, regularization</text>

  <rect x="306" y="264" width="346" height="70" rx="8" fill="#2b3940"/>
  <circle cx="334" cy="299" r="16" fill="#4ca58c"/>
  <text x="329" y="305" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">2</text>
  <text x="362" y="290" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="17" font-weight="700">Macro design</text>
  <text x="362" y="314" fill="#c8d1d8" font-family="Arial, sans-serif" font-size="14">Patchify stem, stage ratios, downsampling</text>

  <rect x="306" y="350" width="346" height="76" rx="8" fill="#3a3130"/>
  <circle cx="334" cy="388" r="16" fill="#bd7f45"/>
  <text x="329" y="394" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">3</text>
  <text x="362" y="377" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="17" font-weight="700">ConvNeXt block</text>
  <text x="362" y="400" fill="#c8d1d8" font-family="Arial, sans-serif" font-size="14">7 x 7 depthwise conv + inverted bottleneck</text>
  <text x="362" y="419" fill="#c8d1d8" font-family="Arial, sans-serif" font-size="14">LayerNorm + GELU</text>

  <path d="M678 285 H722" fill="none" stroke="#f4f7f9" stroke-width="4"/>
  <path d="M714 277 L726 285 L714 293" fill="none" stroke="#f4f7f9" stroke-width="4"/>

  <rect x="726" y="120" width="186" height="330" rx="8" fill="#253128" stroke="#75bd82" stroke-width="2"/>
  <text x="750" y="156" fill="#8bd197" font-family="Arial, sans-serif" font-size="15" font-weight="700">OUTCOME</text>
  <text x="750" y="190" fill="#f4f7f9" font-family="Arial, sans-serif" font-size="25" font-weight="700">ConvNeXt</text>
  <text x="750" y="217" fill="#d2e8d6" font-family="Arial, sans-serif" font-size="15">Pure ConvNet family</text>
  <rect x="750" y="246" width="138" height="54" rx="8" fill="#31513a"/>
  <text x="768" y="269" fill="#a9e0b2" font-family="Arial, sans-serif" font-size="13" font-weight="700">IMAGENET TOP-1</text>
  <text x="768" y="291" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">87.8%</text>
  <rect x="750" y="316" width="138" height="48" rx="8" fill="#3f4630"/>
  <text x="768" y="337" fill="#e7dda1" font-family="Arial, sans-serif" font-size="13" font-weight="700">COCO</text>
  <text x="768" y="356" fill="#ffffff" font-family="Arial, sans-serif" font-size="14">Detection</text>
  <rect x="750" y="378" width="138" height="48" rx="8" fill="#4b3730"/>
  <text x="768" y="399" fill="#edb49d" font-family="Arial, sans-serif" font-size="13" font-weight="700">ADE20K</text>
  <text x="768" y="418" fill="#ffffff" font-family="Arial, sans-serif" font-size="14">Segmentation</text>

  <rect x="48" y="480" width="864" height="48" rx="8" fill="#18232b" stroke="#4e6573"/>
  <text x="72" y="510" fill="#d7e0e5" font-family="Arial, sans-serif" font-size="16">Question tested: how much of the transformer advantage comes from attention, and how much from modern design?</text>
</svg>
