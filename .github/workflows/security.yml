name: Security Scan

on:
    pull_request:
    push:
        branches:
            - '**'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan:
        name: Secrets and Sensitive Content
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out full history
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Scan current repository content policy
              run: npm run scan:sensitive

            - name: Scan Git history with Gitleaks
              run: |
                  docker run --rm \
                    -v "$PWD:/repo" \
                    ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
                    git /repo --config /repo/.gitleaks.toml --redact --no-banner
