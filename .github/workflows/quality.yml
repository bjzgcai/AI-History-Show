name: Quality Gate

on:
    pull_request:
    push:
        branches:
            - '**'

jobs:
    verify:
        name: Lint, Format, and Test
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install game-record parser dependencies
              run: pip install -r requirements-game-record-validation.txt

            - name: Install dependencies
              run: npm ci

            - name: Run PR verification
              run: npm run verify:pr
