<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Chain-of-Thought Prompting process explainer</title><desc id="desc">Original bilingual diagram showing the core process of Chain-of-Thought Prompting.</desc><rect width="1200" height="680" fill="#f4f7fb"/><rect x="0" y="0" width="1200" height="96" fill="#101828"/><text x="64" y="61" class="title">Chain-of-Thought Prompting</text><text x="64" y="153" class="subtitle">Few-shot demonstrations with intermediate natural-language reasoning</text><text x="64" y="193" class="subtitle zhTitle">包含自然语言中间推理的少样本示范</text><g><rect x="80" y="235" width="280" height="230" rx="16" fill="#ffffff" stroke="#1677ff" stroke-width="4"/><circle cx="124" cy="279" r="22" fill="#1677ff"/><text x="124" y="287" text-anchor="middle" class="num">1</text><text x="108" y="345" class="step">Worked examples</text><text x="108" y="392" class="zh">带过程的示例</text></g><path d="M360 350H418" stroke="#334155" stroke-width="6" stroke-linecap="round"/><path d="M406 338l14 12-14 12" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="440" y="235" width="280" height="230" rx="16" fill="#ffffff" stroke="#13a86b" stroke-width="4"/><circle cx="484" cy="279" r="22" fill="#13a86b"/><text x="484" y="287" text-anchor="middle" class="num">2</text><text x="468" y="345" class="step">Generate intermediate steps</text><text x="468" y="392" class="zh">生成中间步骤</text></g><path d="M720 350H778" stroke="#334155" stroke-width="6" stroke-linecap="round"/><path d="M766 338l14 12-14 12" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="800" y="235" width="280" height="230" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="4"/><circle cx="844" cy="279" r="22" fill="#d97706"/><text x="844" y="287" text-anchor="middle" class="num">3</text><text x="828" y="345" class="step">Produce final answer</text><text x="828" y="392" class="zh">给出最终答案</text></g><rect x="80" y="525" width="1000" height="92" rx="12" fill="#e9eef6"/><text x="108" y="564" class="footer">INTERACTION / 互动</text><text x="108" y="596" class="footerText">在直接回答提示与带推理过程的提示之间切换，比较到达最终答案的路径。</text><style>.title{font:700 34px Arial,sans-serif;fill:#fff}.subtitle{font:600 22px Arial,sans-serif;fill:#182230}.zhTitle{font-size:20px}.num{font:700 20px Arial,sans-serif;fill:#fff}.step{font:700 20px Arial,sans-serif;fill:#182230}.zh{font:600 19px Arial,sans-serif;fill:#475467}.footer{font:700 15px Arial,sans-serif;fill:#344054}.footerText{font:500 18px Arial,sans-serif;fill:#182230}</style></svg>
