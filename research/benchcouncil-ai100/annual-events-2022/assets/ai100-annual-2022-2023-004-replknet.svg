<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">RepLKNet re-parameterized large-kernel path</title>
  <desc id="desc">Original explainer showing parallel large and small depth-wise convolution branches during training, equivalent-kernel fusion, a single 31 by 31 deployment path, and reported large-kernel effects.</desc>
  <rect width="960" height="560" fill="#0d1722"/>
  <text x="48" y="54" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="30" font-weight="700">RepLKNet</text>
  <text x="48" y="84" fill="#a9bdd0" font-family="Arial, sans-serif" font-size="17">Large spatial context with a deployment-friendly CNN</text>

  <rect x="48" y="120" width="284" height="188" rx="8" fill="#19324b" stroke="#65a9dc" stroke-width="2"/>
  <text x="70" y="151" fill="#8fc4eb" font-family="Arial, sans-serif" font-size="14" font-weight="700">TRAINING-TIME RepLK BLOCK</text>
  <rect x="70" y="174" width="240" height="44" rx="6" fill="#224564"/>
  <text x="86" y="202" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="17" font-weight="700">31×31 depth-wise conv + BN</text>
  <rect x="70" y="230" width="240" height="44" rx="6" fill="#304a39"/>
  <text x="86" y="258" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="18" font-weight="700">small-kernel branch + BN</text>
  <path d="M190 218 V230" stroke="#dce8f2" stroke-width="3"/>
  <text x="70" y="294" fill="#a9bdd0" font-family="Arial, sans-serif" font-size="15">Parallel branches support optimization</text>

  <path d="M332 214 H394" stroke="#dce8f2" stroke-width="4"/>
  <path d="M376 205 L394 214 L376 223" fill="none" stroke="#dce8f2" stroke-width="4"/>
  <rect x="394" y="148" width="172" height="132" rx="8" fill="#2d2530" stroke="#c087c9" stroke-width="2"/>
  <text x="416" y="181" fill="#d9a3df" font-family="Arial, sans-serif" font-size="14" font-weight="700">STRUCTURAL</text>
  <text x="416" y="203" fill="#d9a3df" font-family="Arial, sans-serif" font-size="14" font-weight="700">RE-PARAMETERIZATION</text>
  <text x="416" y="236" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="20" font-weight="700">Fuse weights</text>
  <text x="416" y="260" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="20" font-weight="700">and batch norms</text>

  <path d="M566 214 H628" stroke="#dce8f2" stroke-width="4"/>
  <path d="M610 205 L628 214 L610 223" fill="none" stroke="#dce8f2" stroke-width="4"/>
  <rect x="628" y="120" width="284" height="188" rx="8" fill="#263528" stroke="#74b77d" stroke-width="2"/>
  <text x="650" y="151" fill="#8fd29a" font-family="Arial, sans-serif" font-size="14" font-weight="700">DEPLOYMENT-TIME PATH</text>
  <rect x="650" y="178" width="240" height="72" rx="6" fill="#34533a"/>
  <text x="680" y="210" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="22" font-weight="700">one equivalent</text>
  <text x="680" y="237" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="22" font-weight="700">31×31 DW kernel</text>
  <text x="650" y="282" fill="#b9d7c0" font-family="Arial, sans-serif" font-size="15">Single branch for inference</text>

  <rect x="48" y="352" width="272" height="112" rx="8" fill="#172536" stroke="#6b8298" stroke-width="2"/>
  <text x="70" y="384" fill="#8fc4eb" font-family="Arial, sans-serif" font-size="14" font-weight="700">SPATIAL EFFECT</text>
  <text x="70" y="419" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="20" font-weight="700">Larger effective</text>
  <text x="70" y="445" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="20" font-weight="700">receptive field</text>

  <rect x="344" y="352" width="272" height="112" rx="8" fill="#3b2e1d" stroke="#d89b58" stroke-width="2"/>
  <text x="366" y="384" fill="#efb97b" font-family="Arial, sans-serif" font-size="14" font-weight="700">REPRESENTATION EFFECT</text>
  <text x="366" y="419" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="20" font-weight="700">Stronger shape bias</text>
  <text x="366" y="445" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="17">than small-kernel CNNs</text>

  <rect x="640" y="352" width="272" height="112" rx="8" fill="#1a3a32" stroke="#62aa8c" stroke-width="2"/>
  <text x="662" y="384" fill="#91d7bb" font-family="Arial, sans-serif" font-size="13" font-weight="700">REPORTED LARGE-MODEL RESULTS</text>
  <text x="662" y="419" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="20" font-weight="700">87.8% ImageNet top-1</text>
  <text x="662" y="445" fill="#f4f7fb" font-family="Arial, sans-serif" font-size="20" font-weight="700">56.0% ADE20K mIoU</text>

  <rect x="48" y="496" width="864" height="36" rx="8" fill="#111f2d"/>
  <text x="70" y="520" fill="#b8cad9" font-family="Arial, sans-serif" font-size="16">Original redraw from the CVPR paper and official implementation · no publisher figure copied</text>
</svg>
