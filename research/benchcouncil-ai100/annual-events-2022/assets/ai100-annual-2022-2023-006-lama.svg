<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">LaMa large-mask inpainting pipeline</title>
  <desc id="desc">Original bilingual explainer showing a masked image entering local and Fourier-global feature paths, guided by large masks and high-receptive-field losses, to produce a restored image.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d9e3ea"/>
    </marker>
    <pattern id="mask-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#8cc8b5"/>
      <path d="M0 18 L18 0" stroke="#bce5d8" stroke-width="3" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="960" height="560" fill="#101820"/>
  <text x="48" y="48" fill="#f4f7f9" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="26" font-weight="700">LaMa · Large-mask inpainting / 大遮挡图像修复</text>
  <text x="48" y="76" fill="#9fb2bf" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15">Global context from early layers through fast Fourier convolution</text>

  <rect x="48" y="112" width="190" height="238" rx="8" fill="#1b2b35" stroke="#78a9c2" stroke-width="2"/>
  <text x="66" y="142" fill="#9bd0e8" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700">1 · INPUT / 输入</text>
  <rect x="68" y="166" width="150" height="116" rx="5" fill="#d9c7a5"/>
  <rect x="68" y="166" width="150" height="34" fill="#78a4b9"/>
  <circle cx="105" cy="218" r="18" fill="#485e6a"/>
  <rect x="139" y="202" width="61" height="52" rx="4" fill="#8e775c"/>
  <path d="M79 270 L118 230 L151 263 L174 238 L212 278" fill="#68816f"/>
  <path d="M126 178 h58 v86 h-58 z M82 217 h112 v32 h-112 z" fill="url(#mask-grid)" opacity="0.95"/>
  <text x="68" y="309" fill="#f4f7f9" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15">masked image + binary mask</text>
  <text x="68" y="332" fill="#b9c8d1" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14">遮挡图像 + 二值遮罩</text>

  <path d="M238 230 H296" stroke="#d9e3ea" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="300" y="112" width="360" height="300" rx="8" fill="#17262f" stroke="#d49a62" stroke-width="2"/>
  <text x="320" y="142" fill="#efb77f" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700">2 · FFC GENERATOR / FFC 生成器</text>
  <rect x="324" y="166" width="128" height="90" rx="6" fill="#243b48" stroke="#78a9c2"/>
  <text x="388" y="196" text-anchor="middle" fill="#eaf3f7" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700">Local path</text>
  <text x="388" y="220" text-anchor="middle" fill="#b7cad4" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14">spatial conv</text>
  <text x="388" y="242" text-anchor="middle" fill="#b7cad4" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13">局部卷积</text>

  <rect x="508" y="166" width="128" height="90" rx="6" fill="#3a2e25" stroke="#d49a62"/>
  <text x="572" y="194" text-anchor="middle" fill="#fff2e4" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700">Global path</text>
  <text x="572" y="218" text-anchor="middle" fill="#e8c7a7" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14">FFT → mix → iFFT</text>
  <text x="572" y="242" text-anchor="middle" fill="#e8c7a7" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13">频域全局特征</text>

  <path d="M452 211 H508" stroke="#d9e3ea" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M508 235 H452" stroke="#d9e3ea" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="364" y="284" width="232" height="70" rx="6" fill="#20372f" stroke="#77b799"/>
  <text x="480" y="312" text-anchor="middle" fill="#bce5d2" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700">Fuse local + global context</text>
  <text x="480" y="338" text-anchor="middle" fill="#cbd8d2" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14">融合局部细节与全图结构</text>
  <path d="M388 256 V282 H445" stroke="#d9e3ea" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M572 256 V282 H515" stroke="#d9e3ea" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="388" fill="#9fb2bf" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14">Image-wide receptive field appears in early layers / 早期层即可看到全图</text>

  <path d="M660 230 H718" stroke="#d9e3ea" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="722" y="112" width="190" height="238" rx="8" fill="#1b2b35" stroke="#77b799" stroke-width="2"/>
  <text x="740" y="142" fill="#a9dfc4" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700">3 · OUTPUT / 输出</text>
  <rect x="742" y="166" width="150" height="116" rx="5" fill="#d9c7a5"/>
  <rect x="742" y="166" width="150" height="34" fill="#78a4b9"/>
  <circle cx="779" cy="218" r="18" fill="#485e6a"/>
  <rect x="813" y="202" width="61" height="52" rx="4" fill="#8e775c"/>
  <path d="M753 270 L792 230 L825 263 L848 238 L886 278" fill="#68816f"/>
  <path d="M800 178 C822 186 838 197 858 218" fill="none" stroke="#f0dfbd" stroke-width="7" opacity="0.72"/>
  <text x="742" y="309" fill="#f4f7f9" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15">coherent restored image</text>
  <text x="742" y="332" fill="#b9c8d1" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="14">结构连贯的修复图像</text>

  <rect x="48" y="446" width="276" height="72" rx="8" fill="#23372f" stroke="#77b799"/>
  <text x="66" y="474" fill="#bce5d2" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700">Large training masks / 大面积训练遮罩</text>
  <text x="66" y="498" fill="#c4d2cb" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13">Force the model to use distant visible context</text>

  <rect x="342" y="446" width="276" height="72" rx="8" fill="#2d2a38" stroke="#a899c6"/>
  <text x="360" y="474" fill="#d7c9f0" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700">High-RF perceptual loss / 高感受野感知损失</text>
  <text x="360" y="498" fill="#d0c8da" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13">Reward globally consistent shapes and structures</text>

  <rect x="636" y="446" width="276" height="72" rx="8" fill="#3a2e25" stroke="#d49a62"/>
  <text x="654" y="474" fill="#f0c59d" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700">Resolution robustness / 分辨率稳健性</text>
  <text x="654" y="498" fill="#ddcbbb" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="13">Train at 256 × 256, generalize to larger images</text>

  <path d="M186 446 V404 H382" stroke="#77b799" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <path d="M480 446 V414" stroke="#a899c6" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <path d="M774 446 V386 H708" stroke="#d49a62" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
</svg>
