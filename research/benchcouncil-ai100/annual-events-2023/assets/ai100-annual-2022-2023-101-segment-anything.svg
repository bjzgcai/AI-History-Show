<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Segment Anything prompt loop</title>
  <desc id="desc">Encode an image once, then answer many segmentation prompts. The prompt encoder and lightweight mask decoder are distinct from the reusable image encoder. Move a point or box prompt and compare the candidate masks and confidence scores.</desc>
  <rect width="960" height="560" fill="#0d1722"/>
  <text x="48" y="52" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="28" font-weight="700"><tspan x="48" dy="0">Segment Anything prompt loop</tspan></text>
  <text x="48" y="82" fill="#a9bdd0" font-family="Arial, sans-serif" font-size="15" font-weight="400"><tspan x="48" dy="0">Encode an image once, then answer many segmentation prompts</tspan></text>
  <g>
  <rect x="48" y="126" width="198" height="176" rx="8" fill="#173d51" stroke="#62b7d7" stroke-width="2"/>
  <text x="66" y="155" fill="#62b7d7" font-family="Arial, sans-serif" font-size="12" font-weight="700"><tspan x="66" dy="0">STEP 1</tspan></text>
  <text x="66" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="66" dy="0">Image encoder</tspan></text>
  <text x="66" y="254" fill="#c8d6e2" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="66" dy="0">Computes reusable</tspan><tspan x="66" dy="18">embedding</tspan></text>
  <path d="M246 214 H252" stroke="#d8e5ef" stroke-width="4" fill="none"/><path d="M240 205 L252 214 L240 223" stroke="#d8e5ef" stroke-width="4" fill="none"/>
</g>
<g>
  <rect x="270" y="126" width="198" height="176" rx="8" fill="#254631" stroke="#79c58c" stroke-width="2"/>
  <text x="288" y="155" fill="#79c58c" font-family="Arial, sans-serif" font-size="12" font-weight="700"><tspan x="288" dy="0">STEP 2</tspan></text>
  <text x="288" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="288" dy="0">Prompt encoder</tspan></text>
  <text x="288" y="254" fill="#c8d6e2" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="288" dy="0">Point, box or mask</tspan><tspan x="288" dy="18">prompt</tspan></text>
  <path d="M468 214 H474" stroke="#d8e5ef" stroke-width="4" fill="none"/><path d="M462 205 L474 214 L462 223" stroke="#d8e5ef" stroke-width="4" fill="none"/>
</g>
<g>
  <rect x="492" y="126" width="198" height="176" rx="8" fill="#55401f" stroke="#e0aa59" stroke-width="2"/>
  <text x="510" y="155" fill="#e0aa59" font-family="Arial, sans-serif" font-size="12" font-weight="700"><tspan x="510" dy="0">STEP 3</tspan></text>
  <text x="510" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="510" dy="0">Mask decoder</tspan></text>
  <text x="510" y="254" fill="#c8d6e2" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="510" dy="0">Combines image and</tspan><tspan x="510" dy="18">prompt</tspan></text>
  <path d="M690 214 H696" stroke="#d8e5ef" stroke-width="4" fill="none"/><path d="M684 205 L696 214 L684 223" stroke="#d8e5ef" stroke-width="4" fill="none"/>
