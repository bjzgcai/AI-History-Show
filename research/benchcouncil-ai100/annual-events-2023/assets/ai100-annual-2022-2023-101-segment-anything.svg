  <rect x="714" y="126" width="198" height="176" rx="8" fill="#563246" stroke="#ce86a6" stroke-width="2"/>
  <text x="732" y="155" fill="#ce86a6" font-family="Arial, sans-serif" font-size="12" font-weight="700"><tspan x="732" dy="0">STEP 4</tspan></text>
  <text x="732" y="192" fill="#f5f8fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"><tspan x="732" dy="0">Candidate masks +</tspan><tspan x="732" dy="22">scores</tspan></text>
  <text x="732" y="254" fill="#c8d6e2" font-family="Arial, sans-serif" font-size="14" font-weight="400"><tspan x="732" dy="0">Returns ambiguous</tspan><tspan x="732" dy="18">alternatives</tspan></text>

</g>
  <rect x="48" y="336" width="864" height="82" rx="8" fill="#132635" stroke="#315267" stroke-width="1.5"/>
